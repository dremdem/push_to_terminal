[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-paste"
version = "0.8.0"
description = "Ubuntu voice-to-clipboard utility with push-to-talk"
requires-python = ">=3.10,<3.15"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "tomli>=2; python_version < '3.11'",
    "whisperx",
    "torch>=2.0",
    "torchvision",
    "torchaudio",
]

[project.optional-dependencies]
openai = ["openai>=1"]
sounddevice = ["sounddevice>=0.4", "soundfile>=0.12"]
tray = [
    "pillow>=12.2.0",
    "pygobject>=3.56.3",
    "pystray>=0.19.5",
]

[project.scripts]
voice-paste = "voice_paste.cli:app"
voice-paste-tray = "voice_paste.tray:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "pytest-cov>=5",
]

# ── PyTorch CUDA source ───────────────────────────────────────────────────────
# Driver on this machine: CUDA 13.2 → supports cu124 wheels (CUDA 12.4).
# Update the index name/URL if moving to a different CUDA version.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
