services:
  voice-paste-whisper:
    build:
      context: docker
      dockerfile: Dockerfile
    image: voice-paste-whisper:latest
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Model caches — shared with host so models aren't re-downloaded
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ${HOME}/.cache/torch:/root/.cache/torch
      # State dir — the Unix socket lives here
      - ${HOME}/.local/state/voice-paste:/run/voice-paste
    environment:
      VP_SOCK: /run/voice-paste/docker-transcribe.sock
      VP_MODEL: ${VP_MODEL:-base}
      VP_DEVICE: ${VP_DEVICE:-cuda}
      VP_COMPUTE_TYPE: ${VP_COMPUTE_TYPE:-float16}
      VP_VAD_METHOD: ${VP_VAD_METHOD:-silero}
